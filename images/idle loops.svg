<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141529"/>
      <stop offset="50%" stop-color="#1f1b3e"/>
      <stop offset="100%" stop-color="#0e101f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg)"/>

  <!-- Geometric Circuit Accents -->
  <circle cx="300" cy="170" r="110" fill="none" stroke="rgba(139, 92, 246, 0.25)" stroke-width="2" stroke-dasharray="8 6"/>
  <circle cx="300" cy="170" r="85" fill="none" stroke="rgba(59, 130, 246, 0.35)" stroke-width="1.5"/>
  <circle cx="300" cy="170" r="60" fill="rgba(139, 92, 246, 0.1)"/>

  <!-- Central Infinity / Loop Icon -->
  <g transform="translate(300, 170) scale(1.15)">
    <!-- Infinity Path -->
    <path d="M -45,0 C -45,-25 -15,-25 0,0 C 15,25 45,25 45,0 C 45,-25 15,-25 0,0 C -15,25 -45,25 -45,0 Z" 
          fill="none" stroke="url(#accent)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <path d="M -45,0 C -45,-25 -15,-25 0,0 C 15,25 45,25 45,0 C 45,-25 15,-25 0,0 C -15,25 -45,25 -45,0 Z" 
          fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    <!-- Center Magic Spark -->
    <polygon points="0,-10 3,-3 10,0 3,3 0,10 -3,3 -10,0 -3,-3" fill="url(#gold)" filter="url(#glow)"/>
  </g>

  <!-- Title -->
  <text x="300" y="325" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">
    IDLE LOOPS
  </text>
  <text x="300" y="355" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#a78bfa" text-anchor="middle" letter-spacing="6">
    TIME LOOP RPG
  </text>
</svg>