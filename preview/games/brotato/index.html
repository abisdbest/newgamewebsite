<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0" />
	<title>Brotato</title>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		body {
			touch-action: none;
			overflow: hidden;
			background-color: black;
			color: white;
			display: flex;
			align-items: center;
			justify-content: center;
			width: 100vw;
			height: 100vh;
		}
		#canvas {
			display: block;
			width: 100%;
			height: 100%;
			object-fit: contain;
		}
		#canvas:focus {
			outline: none;
		}
		.godot {
			font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
			color: #e0e0e0;
			background-color: #3b3943;
			background-image: linear-gradient(to bottom, #403e48, #35333c);
			border: 1px solid #45434e;
			box-shadow: 0 0 1px 1px #2f2d35;
		}
		#status {
			position: absolute;
			left: 0;
			top: 0;
			right: 0;
			bottom: 0;
			display: flex;
			justify-content: center;
			align-items: center;
			visibility: hidden;
		}
		#status-progress {
			width: 366px;
			height: 7px;
			background-color: #38363A;
			border: 1px solid #444246;
			padding: 1px;
			box-shadow: 0 0 2px 1px #1B1C22;
			border-radius: 2px;
			visibility: visible;
		}
		#status-progress-inner {
			height: 100%;
			width: 0;
			box-sizing: border-box;
			transition: width 0.5s linear;
			background-color: #ff3344;
			border: 1px solid #ff5566;
			border-radius: 3px;
		}
		#status-indeterminate {
			height: 42px;
			visibility: visible;
			position: relative;
		}
		#status-indeterminate > div {
			width: 4.5px;
			height: 0;
			border-style: solid;
			border-width: 9px 3px 0 3px;
			border-color: #2b2b2b transparent transparent transparent;
			transform-origin: center 21px;
			position: absolute;
		}
		#status-indeterminate > div:nth-child(1) { transform: rotate( 22.5deg); }
		#status-indeterminate > div:nth-child(2) { transform: rotate( 67.5deg); }
		#status-indeterminate > div:nth-child(3) { transform: rotate(112.5deg); }
		#status-indeterminate > div:nth-child(4) { transform: rotate(157.5deg); }
		#status-indeterminate > div:nth-child(5) { transform: rotate(202.5deg); }
		#status-indeterminate > div:nth-child(6) { transform: rotate(247.5deg); }
		#status-indeterminate > div:nth-child(7) { transform: rotate(292.5deg); }
		#status-indeterminate > div:nth-child(8) { transform: rotate(337.5deg); }
		#status-notice {
			margin: 0 100px;
			line-height: 1.3;
			padding: 8px 12px;
			border-radius: 6px;
			display: none;
		}
	</style>
	<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
</head>
<body>
	<canvas id="canvas">
		HTML5 canvas is not supported in this browser.
	</canvas>
	<div id="status">
		<div id="status-progress" style="display: none;"><div id="status-progress-inner"></div></div>
		<div id="status-indeterminate" style="display: none;">
			<div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div>
		</div>
		<div id="status-notice" class="godot"></div>
	</div>

	<script>
		// Intercept fetch for chunked index.en-default.pck to bypass Cloudflare 25MB file limit
		(function() {
			const origFetch = window.fetch;
			window.fetch = async function(resource, init) {
				const url = typeof resource === 'string' ? resource : (resource && resource.url ? resource.url : '');
				if (url.includes('index.en-default.pck') && !url.includes('.part')) {
					const parts = [
						'index.en-default.pck.part1',
						'index.en-default.pck.part2',
						'index.en-default.pck.part3',
						'index.en-default.pck.part4'
					];
					const baseUrl = url.substring(0, url.lastIndexOf('/') + 1);
					const totalExpectedSize = 93322372;
					const loadedBytes = [0, 0, 0, 0];

					function updateUiProgress() {
						const totalLoaded = loadedBytes.reduce((a, b) => a + b, 0);
						const progEl = document.getElementById('status-progress');
						const innerEl = document.getElementById('status-progress-inner');
						if (progEl && innerEl) {
							progEl.style.display = 'block';
							innerEl.style.width = Math.min(100, (totalLoaded / totalExpectedSize * 100)) + '%';
						}
					}

					try {
						const partPromises = parts.map((part, idx) => {
							const partUrl = baseUrl ? baseUrl + part : part;
							return origFetch(partUrl, init).then(async (res) => {
								if (!res.ok) throw new Error('Failed to load part ' + (idx + 1) + ': HTTP ' + res.status);
								if (!res.body) {
									const buf = await res.arrayBuffer();
									loadedBytes[idx] = buf.byteLength;
									updateUiProgress();
									return buf;
								}
								const reader = res.body.getReader();
								const chunks = [];
								while (true) {
									const { done, value } = await reader.read();
									if (done) break;
									chunks.push(value);
									loadedBytes[idx] += value.length;
									updateUiProgress();
								}
								return new Blob(chunks);
							});
						});

						const results = await Promise.all(partPromises);
						const combinedBlob = new Blob(results, { type: 'application/octet-stream' });
						console.log('[Brotato] Reassembled chunked pack:', combinedBlob.size, 'bytes');

						return new Response(combinedBlob, {
							status: 200,
							statusText: 'OK',
							headers: {
								'Content-Type': 'application/octet-stream',
								'Content-Length': String(combinedBlob.size)
							}
						});
					} catch (err) {
						console.error('[Brotato] Error loading chunked pack:', err);
						throw err;
					}
				}
				return origFetch.apply(this, arguments);
			};
		})();
	</script>
	<script src="index.js"></script>
	<script>
		const GODOT_CONFIG = {
			"args": [],
			"canvasResizePolicy": 2,
			"executable": "index",
			"experimentalVK": false,
			"fileSizes": { "index.en-default.pck": 93322372, "index.wasm": 17862218 },
			"focusCanvas": true,
			"gdnativeLibs": [],
			"mainPack": "index.en-default.pck"
		};
		var engine = new Engine(GODOT_CONFIG);

		(function() {
			const INDETERMINATE_STATUS_STEP_MS = 100;
			var statusProgress = document.getElementById('status-progress');
			var statusProgressInner = document.getElementById('status-progress-inner');
			var statusIndeterminate = document.getElementById('status-indeterminate');
			var statusNotice = document.getElementById('status-notice');

			var initializing = true;
			var statusMode = 'hidden';

			var animationCallbacks = [];
			function animate(time) {
				animationCallbacks.forEach(callback => callback(time));
				requestAnimationFrame(animate);
			}
			requestAnimationFrame(animate);

			function setStatusMode(mode) {
				if (statusMode === mode || !initializing) return;
				[statusProgress, statusIndeterminate, statusNotice].forEach(elem => {
					elem.style.display = 'none';
				});
				animationCallbacks = animationCallbacks.filter(value => value !== animateStatusIndeterminate);
				switch (mode) {
					case 'progress':
						statusProgress.style.display = 'block';
						break;
					case 'indeterminate':
						statusIndeterminate.style.display = 'block';
						animationCallbacks.push(animateStatusIndeterminate);
						break;
					case 'notice':
						statusNotice.style.display = 'block';
						break;
					case 'hidden':
						break;
					default:
						throw new Error('Invalid status mode');
				}
				statusMode = mode;
			}

			function animateStatusIndeterminate(ms) {
				var i = Math.floor(ms / INDETERMINATE_STATUS_STEP_MS % 8);
				if (statusIndeterminate.children[i].style.borderTopColor == '') {
					Array.prototype.slice.call(statusIndeterminate.children).forEach(child => {
						child.style.borderTopColor = '';
					});
					statusIndeterminate.children[i].style.borderTopColor = '#dfdfdf';
				}
			}

			function setStatusNotice(text) {
				while (statusNotice.lastChild) {
					statusNotice.removeChild(statusNotice.lastChild);
				}
				var lines = text.split('\n');
				lines.forEach(line => {
					statusNotice.appendChild(document.createTextNode(line));
					statusNotice.appendChild(document.createElement('br'));
				});
			}

			function displayFailureNotice(err) {
				var msg = err.message || err;
				console.error(msg);
				setStatusNotice(msg);
				setStatusMode('notice');
				initializing = false;
			}

			if (!Engine.isWebGLAvailable()) {
				displayFailureNotice('WebGL not available');
			} else {
				setStatusMode('indeterminate');
				engine.startGame({
					'locale': 'en',
					'onProgress': function(current, total) {
						if (total > 0) {
							statusProgressInner.style.width = (current / total * 100) + '%';
							setStatusMode('progress');
							if (current === total) {
								setTimeout(() => {
									setStatusMode('indeterminate');
								}, 500);
							}
						} else {
							setStatusMode('indeterminate');
						}
					}
				}).then(() => {
					setStatusMode('hidden');
					initializing = false;
				}, displayFailureNotice);
			}
		})();
	</script>
</body>
</html>
