	<link rel="manifest" href="./manifest.webmanifest">
  <script>
    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
    });
    // Remove loading overlay once Phaser canvas is mounted
    const checkCanvas = setInterval(() => {
      const cvs = document.querySelector('canvas');
      if (cvs) {
        const loader = document.getElementById('pokerogue-loader');
        if (loader) {
          loader.style.opacity = '0';
          setTimeout(() => loader.remove(), 400);
        }
        clearInterval(checkCanvas);
      }
    }, 200);
  </script>
  <script type="module" crossorigin src="./assets/index-48e7d695.js"></script>
  <link rel="stylesheet" href="./assets/index-a66f8043.css">
  <style>
    #pokerogue-loader {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      transition: opacity 0.4s ease;
      text-align: center;
      padding: 20px;
    }
    .pr-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #334155;
      border-top-color: #ef4444;
      border-radius: 50%;
      animation: pr-spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes pr-spin { to { transform: rotate(360deg); } }
  </style>
</head>

<body>

    <p style="color: #94a3b8; font-size: 0.9rem; max-width: 380px; line-height: 1.5;">
