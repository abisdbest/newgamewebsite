<!DOCTYPE html>
<html lang="en-us">

<head>



  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Helix Jump</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@200;500&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@200;500&family=MuseoModerno:wght@600&display=swap');
  </style>

</head>

<body class="dark">
  <!-- Google H5 Games Ads -->
  
  <script>
    window.adsbygoogle = window.adsbygoogle || [];
    const adConfig = function (o) {
      window.adsbygoogle.push(o);
    };

    // Global function to show ads
    window.showMyAd = function (type) {
      if (typeof adBreak !== 'function') {
        console.log("adBreak is not ready yet. Skipping ad type: " + type);
        return;
      }
      console.log("Requesting ad of type: " + type);
      adBreak({
        type: type, // 'start', 'next', 'browse', etc.
        name: 'helix_jump_ad',
        beforeAd: () => {
          console.log("Ad starting - Pause game audio here if needed");
          // If we can pause the game, do it here.
          // if (unityInstance) unityInstance.SendMessage('GameObjectName', 'MethodName', 'Pause');
        },
        afterAd: () => {
          console.log("Ad finished - Resume game");
        },
        adBreakDone: (placementInfo) => {
          console.log("Ad break done: " + placementInfo.breakStatus);
        }
      });
    };
  </script>
  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas"></canvas>
  </div>
  <div id="loading-cover" style="display:none;">
    <div id="unity-loading-bar">


      <div id="unity-logo">
        <img src="logo.png">
        <br>
        <p id="loading-txt"
          style="text-align: center; font-family: 'MuseoModerno', cursive;color: white;font-size: 50px;margin-top: 0px;margin-bottom: 0px;">
          Loading...</p>
      </div>


      <div id="unity-progress-bar-empty" style="display: none;">
        <div id="unity-progress-bar-full"></div>
      </div>
      <div class="spinner"></div>
    </div>
  </div>
  <div id="unity-fullscreen-button" style="display: none;"></div>
  <script>
    const hideFullScreenButton = "";
    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/Build.loader.js";
    const config = {
      dataUrl: buildUrl + "/Build.data",
      frameworkUrl: buildUrl + "/Build.framework.js",
      codeUrl: buildUrl + "/Build.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Helix Jump",
      productName: "Helix Jump",
      productVersion: "1.0",
    };

    const container = document.querySelector("#unity-container");
    const canvas = document.querySelector("#unity-canvas");
    const loadingCover = document.querySelector("#loading-cover");
    const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
    const progressBarFull = document.querySelector("#unity-progress-bar-full");
    const fullscreenButton = document.querySelector("#unity-fullscreen-button");
    const spinner = document.querySelector('.spinner');

    const canFullscreen = (function () {
      for (const key of [
        'exitFullscreen',
        'webkitExitFullscreen',
        'webkitCancelFullScreen',
        'mozCancelFullScreen',
        'msExitFullscreen',
      ]) {
        if (key in document) {
          return true;
        }
      }
      return false;
    }());

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      container.className = "unity-mobile";
      config.devicePixelRatio = 1;
    }
    loadingCover.style.display = "";

    const script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        spinner.style.display = "none";
        progressBarEmpty.style.display = "";
        progressBarFull.style.width = `${100 * progress}%`;
      }).then((unityInstance) => {
        // Trigger Preroll Ad
        window.unityInstance = unityInstance; // Expose to global for potential access
        if (typeof window.showMyAd === 'function') {
          // window.showMyAd('start');
        }

        loadingCover.style.display = "none";
        if (canFullscreen) {
          if (!hideFullScreenButton) {
            fullscreenButton.style.display = "";
          }
          fullscreenButton.onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }
      }).catch((message) => {
        alert(message);
      });
    };
    document.body.appendChild(script);
  </script>
</body>

</html>
